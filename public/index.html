<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>Haussmann</title>
<meta name="description" content="Collectionnez les vrais immeubles de Paris, touchez leurs loyers, devenez maire de votre arrondissement.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='14' width='56' height='36' rx='8' fill='%231F3B73' stroke='%232E7B5A' stroke-width='3'/%3E%3Ctext x='32' y='40' font-family='Arial' font-weight='800' font-size='22' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" rel="stylesheet">
<link href="/app/style.css?v=20261017b" rel="stylesheet">
</head>
<body>
<div id="credbar" hidden data-push="money" role="button" aria-label="Crédit encore disponible"></div>
<header id="bar">
  <button class="brand" data-go="map" aria-label="Haussmann, retour à la carte"><span class="plaque-mini">HAUSSMANN</span></button>
  <div class="wallet">
    <button class="money" data-push="money" aria-label="Mon argent : trésorerie et historique">
      <span class="mv"><span class="num" id="cash">—</span><span class="rate num" id="rate"></span></span><i class="plus">+</i>
    </button>
    <button class="avatar" id="avatar" data-push="profile" aria-label="Mon profil">?</button>
  </div>
</header>

<main id="pages">
  <section class="page" id="p-map">
    <div id="map"></div>
    <div class="maptop">
      <button class="score" id="score" data-push="results" aria-label="Résultats de l'Hôtel de Ville"></button>
      <div class="mapbtns">
        <button class="mbtn" id="t-filter" aria-label="Filtrer la carte"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
        <button class="mbtn" id="t-search" aria-label="Rechercher">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      </div>
    </div>
    <div id="search" hidden>
      <input id="q" type="search" placeholder="Une adresse, un monument…" autocomplete="off" enterkeyhint="search">
      <div id="results"></div>
    </div>
    <div class="mapside">
      <button class="mbtn" id="t-north" aria-label="Remettre le nord en haut" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" id="needle"><path d="M12 3l4 9h-8z" fill="#D32F2F"/><path d="M12 21l-4-9h8z" fill="#9AA6B2"/></svg></button>
      <button class="mbtn" id="t-home" aria-label="Voir tout Paris" title="Voir tout Paris">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="filter" id="filter" role="tablist">
      <button data-m="all" aria-selected="true">Tout</button>
      <button data-m="mine" aria-selected="false"><i class="dot mine"></i>Mes biens <span id="n-mine"></span></button>
      <button data-m="sale" aria-selected="false"><i class="dot sale"></i>À vendre <span id="n-sale"></span></button>
    </div>
    <div class="mapbottom">
      <div id="strip" hidden></div>
      <div id="movebar" hidden></div>
      <div id="preview" hidden></div>
      <div id="destcard" hidden></div>
      <div class="dicebar" id="dicebar">
        <button class="dside" id="b-tp" aria-label="Se téléporter sur un de ses biens"><span class="ic">✨</span><small>Téléport · <b id="tps">3</b></small></button>
        <button class="dmain" id="b-roll" aria-label="Lancer le dé"><span class="cube" id="dieico"></span><b>Lancer</b><small id="rolls">10</small></button>
        <button class="dside pk" id="b-pack" data-tab="booster" aria-label="Mes boosters"><span class="ic" id="minipack"></span><small>Boosters</small><b class="badge" id="packbadge" hidden></b></button>
      </div>
    </div>
    <div id="dice3d" hidden></div>
    <button id="pawnoff" hidden><i>↑</i><span>Vous</span></button>
  </section>
  <section class="page dark" id="p-booster" hidden></section>
  <section class="page" id="p-assets" hidden></section>
  <section class="page" id="p-market" hidden></section>
  <section class="page" id="p-paris" hidden></section>
  <section class="page detail" id="p-detail" hidden></section>
</main>

<nav id="tabs" aria-label="Navigation">
  <button data-tab="map" aria-selected="true"><svg class="ti" viewBox="0 0 32 32"><defs><linearGradient id="tg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#tg1)"/><rect x="1" y="1" width="30" height="15" rx="9" fill="#fff" opacity=".14"/><path d="M7 10.5l5.5-2 7 2 5.5-2v13.5l-5.5 2-7-2-5.5 2z" fill="#fff"/><path d="M12.5 8.5v13.5M19.5 10.5v13.5" stroke="#93C5FD" stroke-width="1.3"/><circle cx="19.5" cy="13" r="3.4" fill="#F43F5E"/><circle cx="19.5" cy="13" r="1.3" fill="#fff"/></svg><span>Carte</span></button>
  <button data-tab="assets" aria-selected="false"><svg class="ti" viewBox="0 0 32 32"><defs><linearGradient id="tg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#tg2)"/><rect x="1" y="1" width="30" height="15" rx="9" fill="#fff" opacity=".14"/><path d="M7.5 13.5l3-5h11l3 5z" fill="#EDE9FE"/><rect x="9" y="13.5" width="14" height="11" fill="#fff"/><g fill="#8B5CF6"><rect x="11" y="15.5" width="2.2" height="2.6"/><rect x="14.9" y="15.5" width="2.2" height="2.6"/><rect x="18.8" y="15.5" width="2.2" height="2.6"/><rect x="11" y="20" width="2.2" height="2.6"/><rect x="18.8" y="20" width="2.2" height="2.6"/><path d="M14.6 24.5v-3.6a1.4 1.4 0 012.8 0v3.6z"/></g><path d="M8.3 18.9h15.4" stroke="#C4B5FD" stroke-width=".9"/></svg><span>Patrimoine</span></button>
  <button data-tab="market" aria-selected="false"><svg class="ti" viewBox="0 0 32 32"><defs><linearGradient id="tg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#tg3)"/><rect x="1" y="1" width="30" height="15" rx="9" fill="#fff" opacity=".14"/><path d="M7.5 16.2l8.7-8.7h8.3v8.3l-8.7 8.7a1.6 1.6 0 01-2.3 0l-6-6a1.6 1.6 0 010-2.3z" fill="#fff"/><circle cx="20.6" cy="11.4" r="1.7" fill="#F59E0B"/><text x="14.6" y="20.6" text-anchor="middle" font-size="8.5" font-weight="900" fill="#D97706" font-family="Inter Tight,system-ui,sans-serif" transform="rotate(-45 14.6 18)">€</text></svg><span>Marché</span></button>
  <button data-tab="paris" aria-selected="false"><svg class="ti" viewBox="0 0 32 32"><defs><linearGradient id="tg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#E11D48"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#tg4)"/><rect x="1" y="1" width="30" height="15" rx="9" fill="#fff" opacity=".14"/><path d="M16 5.5l1.1 6.2 2.6 6.3 3.8 8.5h-3.6c-.9-2.6-2.2-4-3.9-4s-3 1.4-3.9 4H8.5l3.8-8.5 2.6-6.3z" fill="#fff"/><path d="M13.6 11.8h4.8M12.2 18h7.6" stroke="#FDA4AF" stroke-width="1.3"/></svg><span>Paris</span></button>
</nav>

<div id="reveal" hidden></div>
<div id="onb" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="loading"><span class="plaque-mini big">HAUSSMANN</span><p id="loadmsg">Chargement de Paris…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/app/models.js?v=20261017b"></script>
<script src="/app/core.js?v=20261017b"></script>
<script src="/app/api.js?v=20261017b"></script>
<script src="/app/cards.js?v=20261017b"></script>
<script src="/app/map.js?v=20261017b"></script>
<script src="/app/pawn.js?v=20261017b"></script>
<script src="/app/life.js?v=20261017b"></script>
<script src="/app/pages.js?v=20261017b"></script>
<script src="/app/booster.js?v=20261017b"></script>
<script src="/app/onboard.js?v=20261017b"></script>
<script src="/app/landing.js?v=20261017b"></script>
<script src="/app/main.js?v=20261017b"></script>
</body>
</html>
